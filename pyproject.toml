[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cusadi2"
version = "0.2.0"
description = "Level- and stage-parallel GPU evaluation of batched CasADi functions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "John Viljoen", email = "john_viljoen@berkeley.edu" },
]
dependencies = ["casadi", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["cusadi2*"]

[tool.setuptools.package-data]
cusadi2 = ["*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
