[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cusadi"
version = "0.1.0"
description = "Level-parallel GPU evaluation of batched CasADi functions (fork of se-hwan/cusadi)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "John Viljoen", email = "john_viljoen@berkeley.edu" },
]
# Upstream foundation this fork builds on.
maintainers = [
    { name = "Se Hwan Jeon", email = "sehwan@mit.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Core install. cusadi is CUDA-only (it's in the name), and the JAX-FFI backend
# is the default — so a bare `pip install cusadi` pulls the CUDA jax build.
# casadi/numpy are required by the backend-agnostic DAG + codegen layer
# (cusadi/level_parallel/codegen.py, dag.py).
dependencies = [
    "casadi",
    "numpy",
    "jax[cuda13]",
]

# Opt-in backends/profiles on top of the default jax install:
#   pip install -e .            # default: jax[cuda13] backend
#   pip install -e ".[torch]"   # add the PyTorch path (LP core, CusadiFunction)
#   pip install -e ".[all]"     # both backends
# `jax` is kept as an explicit (redundant) alias so `.[jax]` also resolves.
[project.optional-dependencies]
jax = ["jax[cuda13]"]
torch = ["torch"]
all = ["torch", "jax[cuda13]"]

[project.urls]
Upstream = "https://github.com/se-hwan/cusadi"

[tool.setuptools.packages.find]
include = ["cusadi*"]
